# ═══════════════════════════════════════════════════════════════════════════
#  Contribution Snake — generates animated SVGs from your contribution graph
# ═══════════════════════════════════════════════════════════════════════════
#
#  Light SVG  → github-contribution-grid-snake.svg
#  Dark SVG   → github-contribution-grid-snake-dark.svg
#
#  Both are pushed to the `output` branch and referenced in the README via:
#    https://raw.githubusercontent.com/<user>/<user>/output/<filename>.svg
# ═══════════════════════════════════════════════════════════════════════════

name: Generate Contribution Snake

on:
  # Run every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

  # Also run on pushes to main (so new repo setup works instantly)
  push:
    branches:
      - main

jobs:
  generate:
    name: Generate Snake Animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      # ── Step 1: Generate the SVGs ──────────────────────────────────────
      - name: Generate snake SVGs (light & dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Push SVGs to the `output` branch ──────────────────────
      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
